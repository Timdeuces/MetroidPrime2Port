name: android

# Started by hand (Actions tab, or `gh workflow run android -r port`) when a
# tester needs an APK; pushes do not build one.
on:
  workflow_dispatch:

# Only the newest run per branch matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.7"
      # The runner's own NDK is older than the r29 app/build.gradle pins, and
      # ANDROID_NDK_HOME (preset by the image) wins over the pin in
      # tools/android_apk.sh, so it is pointed at the pinned one.
      - name: SDK, NDK and Rust target
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.31.5" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      # Use the release key when available; otherwise make a clearly labeled
      # debug-signed APK that cannot update a release installation.
      - name: Build
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MP_APK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MP_APK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MP_APK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" && -z "$MP_APK_KEYSTORE_PASSWORD" && -z "$MP_APK_KEY_ALIAS" && -z "$MP_APK_KEY_PASSWORD" ]]; then
            echo "::warning::No Android signing secrets available; the debug-signed APK cannot update a release installation."
            bash tools/android_apk.sh :app:assembleRelease
            echo "signing=debug" >> "$GITHUB_OUTPUT"
          else
            if [[ -z "$KEYSTORE_BASE64" || -z "$MP_APK_KEYSTORE_PASSWORD" || -z "$MP_APK_KEY_ALIAS" || -z "$MP_APK_KEY_PASSWORD" ]]; then
              echo "::error::Android signing secrets are incomplete; configure all four or remove them all."
              exit 1
            fi
            export MP_APK_KEYSTORE="$RUNNER_TEMP/release.jks"
            trap 'rm -f "$MP_APK_KEYSTORE"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$MP_APK_KEYSTORE"
            test -s "$MP_APK_KEYSTORE"
            bash tools/android_apk.sh --strict-signing :app:assembleRelease
            echo "signing=release" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify and package APK
        shell: bash
        env:
          SIGNING: ${{ steps.build.outputs.signing }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          digest=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "signer: $digest"
          test -n "$digest"
          if [[ "$SIGNING" == release ]]; then
            if [[ "$digest" != 5c380a13d5bfc5c57a093a22d2ec70d62109a927f76b0bf7fe61db7d5428bd20 ]]; then
              echo "::error::APK was not signed with the project's release key."
              exit 1
            fi
            suffix=
          elif [[ "$SIGNING" == debug ]]; then
            suffix=-debug-signed
          else
            echo "::error::Unknown APK signing mode: $SIGNING"
            exit 1
          fi
          version=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          mkdir -p dist
          cp "$apk" "dist/metroid-prime2-port-$version-${GITHUB_SHA::9}${suffix}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.signing == 'debug' && 'android-apk-debug-signed' || 'android-apk' }}
          path: dist/*.apk
          if-no-files-found: error
